header:
    version: 18

repos:
    meta-raspberrypi:
        url: https://github.com/agherzan/meta-raspberrypi.git
        path: sources/meta-raspberrypi
        branch: scarthgap

    meta-lts-mixins:
        url: https://git.yoctoproject.org/meta-lts-mixins
        path: sources/meta-lts-mixins
        commit: 66ceeebd047d7fdfc8668b300319a76da8ae257d

local_conf_header:
    raspberrypi: |
        RPI_USE_U_BOOT = "1"
        ENABLE_UART = "1"
        ENABLE_SPI_BUS = "1"
        ENABLE_CAN = "1"
        CAN_OSCILLATOR="8000000"
        CAN0_INTERRUPT_PIN = "12"
        CAN1_INTERRUPT_PIN = "16"
        IMAGE_INSTALL:append = " kernel-image kernel-devicetree linux-firmware-rpidistro-bcm43430 linux-firmware-rpidistro-bcm43455 wpa-supplicant iw kernel-modules fake-hwclock can-utils"
        DISTRO_FEATURES:append = " wifi"
        IMAGE_FSTYPES:remove = " rpi-sdimg"
        KERNEL_IMAGETYPE = "uImage"
        KERNEL_IMAGETYPE_UBOOT = "uImage"
        RPI_KERNEL_IMAGE = "uImage"
        PREFERRED_PROVIDER_virtual/kernel = "linux-raspberrypi"
        BOOT_SPACE = "131072"
        LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"